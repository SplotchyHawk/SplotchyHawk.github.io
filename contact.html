<head>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: linear-gradient(to bottom right, #20a11b, #33b4db, #2806e7);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .contact-container {
      width: 100%;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    ul {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      list-style: none;
      gap: 2rem;
    }

    .item a {
      text-decoration: none;
      width: 4.8rem;
      height: 4.8rem;
      background-color: #f0f9fe;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 1;
      border: 3px solid #f0f9fe;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .item a::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background: var(--bg-color);
      z-index: 0;
      scale: 1 0;
      transform-origin: bottom;
      transition: scale 0.5s ease;
    }

    .item:hover a::before {
      scale: 1 1;
    }

    .icon {
      font-size: 2rem;
      color: hsl(203, 92%, 8%);
      transition: 0.5s ease;
      z-index: 2;
    }

    .item a:hover .icon {
      color: #fff;
      transform: rotateY(360deg);
    }

    .item:nth-child(1) {
      --bg-color: linear-gradient(to bottom right, #f9ce34, #ee2a7b, #6228d7);
    }

    .item:nth-child(2) {
      --bg-color: #0077b5;
    }

    .item:nth-child(3) {
      --bg-color: #004F9F;
    }

    .item:nth-child(4) {
      --bg-color: #6e5494;
    }

    .navbar {
      overflow: hidden;
      background-color: #23a765;
      position: fixed;
      top: 0;
      width: 100%;
      height: 7.5%;
      left: 0;
      z-index: 1000;
      border-bottom: 2px solid rgb(255, 255, 255);
    }

    /* Links inside the navbar */
    .navbar a {
      float: left;
      display: block;
      color: rgb(255, 255, 255);
      text-align: center;
      padding: 25px 16px;
      text-decoration: none;
      font-family: 'Times New Roman', Times, serif, sans-serif;
      white-space: nowrap;
      /* prevents links from breaking */
    }

    /* Change background on mouse-over */
    .navbar a:hover {
      border-top: 2mm ridge rgb(61, 173, 130);
      background: #3498db;
      color: rgb(255, 255, 255);
    }

    @media (max-width: 500px) {
      .item a {
        width: 3.8rem;
        height: 3.8rem;
      }

      .icon {
        font-size: 1.5rem;
      }

      ul {
        gap: 1.5rem;
      }

      .navbar {
        height: auto;
      }

      .navbar a {
        padding: 12px 8px;
        font-size: 14px;
        float: none;
        display: inline-block;
        white-space: normal;
      }
    }
  </style>
